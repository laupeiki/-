<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星座运势查询</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#0f0c29 0%,#302b63 50%,#24243e 100%);min-height:100vh;color:#eee}
  .container{max-width:480px;margin:0 auto;padding:32px 20px 60px}
  .page{animation:fadeUp .5s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  .hidden{display:none!important}

  /* 首页 */
  .hero{text-align:center;padding:40px 0 30px}
  .hero-emoji{font-size:56px;margin-bottom:12px}
  h1{font-size:28px;font-weight:800;letter-spacing:2px;margin-bottom:8px}
  .hero-sub{font-size:14px;color:#a0a0c0}

  .section-title{font-size:15px;font-weight:700;color:#ffd700;margin:24px 0 14px;padding-left:10px;border-left:3px solid #ffd700}
  .type-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .type-tab{padding:8px 16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:20px;font-size:13px;color:#ccc;cursor:pointer;transition:all .2s}
  .type-tab.active{background:linear-gradient(135deg,#ffd700,#ffb700);color:#1a1a2e;border-color:transparent;font-weight:700}

  .sign-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .sign-card{text-align:center;padding:18px 8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;cursor:pointer;transition:all .15s}
  .sign-card:active{transform:scale(.96)}
  .sign-card:hover{background:rgba(255,255,255,.1)}
  .sign-emoji{font-size:32px;margin-bottom:6px}
  .sign-name{font-size:14px;font-weight:600}
  .sign-date{font-size:11px;color:#888;margin-top:2px}

  /* 加载 */
  .loading{text-align:center;padding:100px 0}
  .spinner{width:42px;height:42px;margin:0 auto 18px;border:4px solid rgba(255,255,255,.15);border-top-color:#ffd700;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading p{color:#a0a0c0;font-size:14px}

  /* 结果页 */
  .result-head{text-align:center;padding:20px 0 24px;position:relative}
  .back-btn{position:absolute;left:0;top:20px;background:rgba(255,255,255,.1);border:none;color:#fff;padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer}
  .result-emoji{font-size:48px;margin-bottom:8px}
  .result-name{font-size:24px;font-weight:700}
  .result-date{font-size:13px;color:#a0a0c0;margin-top:4px}

  .score-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
  .score-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px}
  .score-label{font-size:12px;color:#a0a0c0;margin-bottom:8px}
  .score-bar{height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
  .score-fill{height:100%;border-radius:4px;transition:width .6s ease}
  .score-val{font-size:20px;font-weight:700;margin-top:8px}

  .info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .info-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 8px;text-align:center}
  .info-label{font-size:11px;color:#a0a0c0;margin-bottom:6px}
  .info-val{font-size:15px;font-weight:700;color:#ffd700}

  .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;margin-bottom:16px}
  .card-title{font-size:15px;font-weight:700;color:#ffd700;margin-bottom:12px;padding-left:10px;border-left:3px solid #ffd700}
  .card-text{font-size:14px;line-height:2;color:#d0d0e0;text-align:justify}
  .card-text+.card-text{margin-top:10px}

  .btn{display:block;width:100%;padding:14px;background:linear-gradient(135deg,#ffd700,#ffb700);color:#1a1a2e;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:20px}
  .btn:active{transform:scale(.97)}
  .btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);margin-top:12px}

  .error-box{background:rgba(233,69,96,.15);border:1px solid rgba(233,69,96,.4);color:#ff8a8a;padding:16px;border-radius:12px;font-size:13px;line-height:1.8;margin-top:20px;text-align:center}
  .error-box a{color:#ffd700;text-decoration:underline}
</style>
</head>
<body>
<div class="container">

  <!-- 首页 -->
  <div class="page" id="page-home">
    <div class="hero">
      <div class="hero-emoji">🔮</div>
      <h1>星座运势查询</h1>
      <p class="hero-sub">选择你的星座，查看今日、本周、本月或本年运势</p>
    </div>

    <div class="section-title">运势类型</div>
    <div class="type-tabs" id="typeTabs">
      <div class="type-tab active" data-type="today">今日运势</div>
      <div class="type-tab" data-type="tomorrow">明日运势</div>
      <div class="type-tab" data-type="week">本周运势</div>
      <div class="type-tab" data-type="month">本月运势</div>
      <div class="type-tab" data-type="year">本年运势</div>
    </div>

    <div class="section-title">选择星座</div>
    <div class="sign-grid" id="signGrid"></div>
  </div>

  <!-- 加载 -->
  <div class="page hidden" id="page-loading">
    <div class="loading">
      <div class="spinner"></div>
      <p>正在连接星象，请稍候…</p>
    </div>
  </div>

  <!-- 结果 -->
  <div class="page hidden" id="page-result">
    <div class="result-head">
      <button class="back-btn" onclick="goHome()">← 返回</button>
      <div class="result-emoji" id="rEmoji"></div>
      <div class="result-name" id="rName"></div>
      <div class="result-date" id="rDate"></div>
    </div>
    <div id="rBody"></div>
    <button class="btn" onclick="goHome()">查其他星座</button>
    <button class="btn btn-ghost" onclick="copyLink()">复制页面链接</button>
  </div>

</div>

<script>
var API_KEY='9a02fa8c2ab3473e7817adbfd1b60427';
var API_URL='https://web.juhe.cn/constellation/getAll';

var SIGNS=[
  {name:'白羊座',emoji:'♈',date:'3.21-4.19'},{name:'金牛座',emoji:'♉',date:'4.20-5.20'},
  {name:'双子座',emoji:'♊',date:'5.21-6.21'},{name:'巨蟹座',emoji:'♋',date:'6.22-7.22'},
  {name:'狮子座',emoji:'♌',date:'7.23-8.22'},{name:'处女座',emoji:'♍',date:'8.23-9.22'},
  {name:'天秤座',emoji:'♎',date:'9.23-10.23'},{name:'天蝎座',emoji:'♏',date:'10.24-11.22'},
  {name:'射手座',emoji:'♐',date:'11.23-12.21'},{name:'摩羯座',emoji:'♑',date:'12.22-1.19'},
  {name:'水瓶座',emoji:'♒',date:'1.20-2.18'},{name:'双鱼座',emoji:'♓',date:'2.19-3.20'}
];

var TYPE_LABELS={today:'今日运势',tomorrow:'明日运势',week:'本周运势',month:'本月运势',year:'本年运势'};
var currentType='today';

function $(id){return document.getElementById(id)}
function show(id){
  ['page-home','page-loading','page-result'].forEach(function(p){$(p).classList.add('hidden')});
  $(id).classList.remove('hidden');window.scrollTo(0,0)
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* 初始化星座列表 */
var grid=$('signGrid');
SIGNS.forEach(function(s){
  var div=document.createElement('div');
  div.className='sign-card';
  div.innerHTML='<div class="sign-emoji">'+s.emoji+'</div><div class="sign-name">'+esc(s.name)+'</div><div class="sign-date">'+esc(s.date)+'</div>';
  div.onclick=function(){query(s.name)};
  grid.appendChild(div);
});

/* 运势类型切换 */
document.querySelectorAll('.type-tab').forEach(function(tab){
  tab.onclick=function(){
    document.querySelectorAll('.type-tab').forEach(function(t){t.classList.remove('active')});
    tab.classList.add('active');
    currentType=tab.dataset.type;
  }
});

/* 查询 */
function query(signName){
  show('page-loading');
  var url=API_URL+'?key='+encodeURIComponent(API_KEY)+'&consName='+encodeURIComponent(signName)+'&type='+currentType;
  fetch(url).then(function(r){return r.json()}).then(function(data){
    if(data.error_code===0){render(data,signName)}
    else{renderError('接口返回错误：'+esc(data.reason||'未知错误'))}
  }).catch(function(err){
    renderError('网络请求失败。聚合数据接口可能存在跨域限制，请尝试以下方法：<br>1. 在电脑浏览器安装 <b>Allow CORS</b> 插件后刷新重试<br>2. 或使用手机流量访问（部分运营商不拦截CORS）<br>3. 错误详情：'+esc(err.message));
  });
}

/* 渲染结果 */
function render(data,signName){
  var sign=SIGNS.find(function(s){return s.name===signName});
  $('rEmoji').textContent=sign?sign.emoji:'⭐';
  $('rName').textContent=signName+' · '+TYPE_LABELS[currentType];
  $('rDate').textContent=data.datetime||data.date||'';

  var html='';

  /* today / tomorrow：指数卡片 */
  if(currentType==='today'||currentType==='tomorrow'){
    html+='<div class="score-grid">';
    [['all','综合指数','#ffd700'],['health','健康指数','#4ecdc4'],['love','爱情指数','#ff6b6b'],['money','财运指数','#45b7d1'],['work','工作指数','#96ceb4']].forEach(function(item){
      var key=item[0],label=item[1],color=item[2];
      var val=data[key]; if(val===undefined||val===null||val==='')return;
      var pct=Math.min(100,Math.max(0,parseInt(val)||0));
      html+='<div class="score-card"><div class="score-label">'+label+'</div><div class="score-bar"><div class="score-fill" style="width:'+pct+'%;background:'+color+'"></div></div><div class="score-val" style="color:'+color+'">'+esc(String(val))+'</div></div>';
    });
    html+='</div>';

    html+='<div class="info-grid">';
    if(data.color)html+='<div class="info-card"><div class="info-label">幸运色</div><div class="info-val">'+esc(data.color)+'</div></div>';
    if(data.number!==undefined&&data.number!==null)html+='<div class="info-card"><div class="info-label">幸运数字</div><div class="info-val">'+esc(String(data.number))+'</div></div>';
    if(data.QFriend)html+='<div class="info-card"><div class="info-label">速配星座</div><div class="info-val">'+esc(data.QFriend)+'</div></div>';
    html+='</div>';

    if(data.summary){
      html+='<div class="card"><div class="card-title">运势概述</div><div class="card-text">'+esc(data.summary)+'</div></div>';
    }
  }

  /* week */
  if(currentType==='week'){
    if(data.health)html+='<div class="card"><div class="card-title">健康运势</div><div class="card-text">'+esc(data.health)+'</div></div>';
    if(data.work)html+='<div class="card"><div class="card-title">工作运势</div><div class="card-text">'+esc(data.work)+'</div></div>';
    if(data.love)html+='<div class="card"><div class="card-title">爱情运势</div><div class="card-text">'+esc(data.love)+'</div></div>';
    if(data.money)html+='<div class="card"><div class="card-title">财运运势</div><div class="card-text">'+esc(data.money)+'</div></div>';
    if(data.job&&data.job!==data.work)html+='<div class="card"><div class="card-title">职场运势</div><div class="card-text">'+esc(data.job)+'</div></div>';
  }

  /* month */
  if(currentType==='month'){
    if(data.all)html+='<div class="card"><div class="card-title">综合运势</div><div class="card-text">'+esc(data.all)+'</div></div>';
    if(data.health)html+='<div class="card"><div class="card-title">健康运势</div><div class="card-text">'+esc(data.health)+'</div></div>';
    if(data.love)html+='<div class="card"><div class="card-title">爱情运势</div><div class="card-text">'+esc(data.love)+'</div></div>';
    if(data.money)html+='<div class="card"><div class="card-title">财运运势</div><div class="card-text">'+esc(data.money)+'</div></div>';
    if(data.work)html+='<div class="card"><div class="card-title">工作运势</div><div class="card-text">'+esc(data.work)+'</div></div>';
  }

  /* year */
  if(currentType==='year'){
    if(data.mima&&data.mima.info){
      html+='<div class="card"><div class="card-title">年度密码 · '+esc(data.mima.info)+'</div>';
      if(data.mima.text&&data.mima.text.length){
        data.mima.text.forEach(function(t){html+='<div class="card-text">'+esc(t)+'</div>'});
      }
      html+='</div>';
    }
    if(data.career&&data.career.length){
      html+='<div class="card"><div class="card-title">事业运</div>';
      data.career.forEach(function(t){html+='<div class="card-text">'+esc(t)+'</div>'});
      html+='</div>';
    }
    if(data.love&&data.love.length){
      html+='<div class="card"><div class="card-title">感情运</div>';
      data.love.forEach(function(t){html+='<div class="card-text">'+esc(t)+'</div>'});
      html+='</div>';
    }
    if(data.finance&&data.finance.length){
      html+='<div class="card"><div class="card-title">财运</div>';
      data.finance.forEach(function(t){html+='<div class="card-text">'+esc(t)+'</div>'});
      html+='</div>';
    }
  }

  $('rBody').innerHTML=html;
  show('page-result');
}

function renderError(msg){
  $('rEmoji').textContent='⚠️';
  $('rName').textContent='查询失败';
  $('rDate').textContent='';
  $('rBody').innerHTML='<div class="error-box">'+msg+'</div>';
  show('page-result');
}

function goHome(){show('page-home')}
function copyLink(){
  var url=location.href;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){alert('链接已复制！')})
  }else{
    var ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);alert('链接已复制！');
  }
}
</script>
</body>
</html>
